name: Android all-sources

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing
        id: signing
        run: |
          python scripts/configure_signing.py
          if [ -f android/key.properties ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置发布签名 Secrets，本次 APK 使用 debug 签名，仅供测试，不可用于正式分发。"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py --all-sources
      - name: 校验 APK 签名证书
        if: steps.signing.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ vars.ANDROID_CERT_SHA256 }}'
          if [ -z "$expected" ]; then
            echo "未设置仓库变量 ANDROID_CERT_SHA256，跳过证书指纹比对。" >&2
            exit 0
          fi
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n1 || true)
          if [ -z "$apksigner" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n1)
          fi
          for apk in dist/android/*.apk; do
            echo "== $(basename "$apk")"
            output=$("$apksigner" verify --print-certs "$apk" 2>&1 || true)
            printf '%s\n' "$output"
            if ! printf '%s' "$output" | tr -d ':' | tr '[:upper:]' '[:lower:]' | grep -q "$expected"; then
              echo "签名证书与发布证书不一致，已终止。" >&2
              exit 1
            fi
          done
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 生成发布文件清单
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          mkdir -p release
          cp artifacts/zhenguojian-android/* release/
          rm -f release/SHA256SUMS.txt
          cd release
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          tag="app-v${version//+/-}"
          {
            printf '%s\n\n' "版本 ${version}。真果鉴（全部站源）Android 构建。"
            printf '%s\n' "- *-arm64-v8a.apk：绝大多数手机选这个"
            printf '%s\n' "- *-armeabi-v7a.apk：较老的 32 位手机"
            printf '%s\n' "- *-x86_64.apk：模拟器"
            printf '\n%s\n' "校验：SHA256SUMS.txt"
            if printf '%s' "${{ vars.ANDROID_CERT_SHA256 }}" | grep -q .; then
              printf '%s\n' "签名证书 SHA-256：${{ vars.ANDROID_CERT_SHA256 }}"
            else
              printf '%s\n' "签名证书：未配置（当前为 debug 签名，仅供测试）"
            fi
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --title "真果鉴 ${version}" --notes-file notes.md
            # 清理上一次构建留下、本轮已不再产出的附件，避免下载到过期文件。
            for name in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              if [ ! -e "release/$name" ]; then
                gh release delete-asset "$tag" "$name" --yes
              fi
            done
          else
            gh release create "$tag" release/* --title "真果鉴 ${version}" --notes-file notes.md
          fi
